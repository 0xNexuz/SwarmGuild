name: Testnet recheck

# Rechecks the Testnet deployment and every recorded job from GitHub's runners, with no keys.
on:
  push:
    paths:
      - deployment/testnet.json
      - evidence/testnet/**
      - site/**
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Recheck against public Testnet RPC
        run: |
          if [ ! -f deployment/testnet.json ]; then echo 'Not deployed to Testnet yet.'; exit 0; fi
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/verify.mjs
      - name: Load the live site in a browser and compare it with the chain
        run: |
          if [ ! -f deployment/testnet.json ]; then exit 0; fi
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/check-site.mjs https://swarmguild.vercel.app
